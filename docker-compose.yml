services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://mangawatch:mangawatch@db:5432/mangawatch
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mangawatch
      POSTGRES_PASSWORD: mangawatch
      POSTGRES_DB: mangawatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangawatch"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
