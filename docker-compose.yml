services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8000}
      - DATABASE_URL=postgresql://mangawatch:mangawatch@db:5432/mangawatch
      - JWT_SECRET=${JWT_SECRET}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@mangawatch.app}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - POLL_INTERVAL_MANGADEX=${POLL_INTERVAL_MANGADEX:-1800}
      - POLL_INTERVAL_SCRAPE=${POLL_INTERVAL_SCRAPE:-7200}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mangawatch
      POSTGRES_PASSWORD: mangawatch
      POSTGRES_DB: mangawatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangawatch"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
