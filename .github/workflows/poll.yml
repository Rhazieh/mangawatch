name: Poll

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger poll
        run: |
          curl -sf --max-time 120 \
            -X POST https://mangawatch.fly.dev/internal/poll \
            -H "Authorization: Bearer ${{ secrets.POLL_SECRET }}" \
            -H "Content-Type: application/json"
